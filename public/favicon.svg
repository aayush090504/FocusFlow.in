<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="ff-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ff-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- High-res rounded square container -->
  <rect width="48" height="48" rx="12" fill="url(#ff-grad)" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#ff-glow)" stroke-width="1.5" fill="none" />

  <!-- Focus Flow Timer Brand Icon (centered in 48x48 viewport) -->
  <g transform="translate(24, 26)" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top crown / button -->
    <line x1="-5" y1="-18" x2="5" y2="-18" />
    <line x1="0" y1="-18" x2="0" y2="-13" />
    <!-- Secondary lap pusher -->
    <line x1="10" y1="-14" x2="7.5" y2="-11.5" stroke-width="2.5" />
    
    <!-- Circular timer body -->
    <circle cx="0" cy="0" r="13" />
    
    <!-- Timer active clock hands (12:00 up and 2:15 flow angle) -->
    <line x1="0" y1="0" x2="0" y2="-7.5" stroke-width="3.2" />
    <line x1="0" y1="0" x2="5.5" y2="-3" stroke-width="3.2" />
    
    <!-- Center pivot point -->
    <circle cx="0" cy="0" r="1.8" fill="#ffffff" stroke="none" />
  </g>
</svg>
